[grid]
origin = [0.0, 0.0, 0.0]
dimensions = [500, 300, 500]
voxel_size = 1.0

[server]
address = "127.0.0.1:4433"

# Four cameras aimed into a shared volume. The optional stream ports expose
# rendered grayscale frames to external camera clients.
[[cameras]]
id = 0
position = [-500.0, 2.0, -500.0]
look_at = [0.0, 250.0, 0.0]
fov_horizontal = 90.0
fov_vertical = 58.72
resolution = [1280, 720]
stream_port = 9001

