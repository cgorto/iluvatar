[workspace]
resolver = "2"
members = [
    "crates/iluvatar-core",
    "crates/iluvatar-camera",
    "crates/iluvatar-server",
    "crates/iluvatar-simulator", "k230/hello",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/gorto/iluvatar"

[workspace.dependencies]
# Shared dependencies across workspace
glam = { version = "0.30.7", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.0", features = ["alloc"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async runtime
smol = "2.0"
async-channel = "2.3"
futures-lite = "2.5"
async-compat = "0.2"

# Networking
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"

# Memory management
bumpalo = { version = "3.16", features = ["collections"] }

# Internal crates
iluvatar-core = { path = "crates/iluvatar-core" }
iluvatar-camera = { path = "crates/iluvatar-camera" }
iluvatar-server = { path = "crates/iluvatar-server" }
iluvatar-simulator = { path = "crates/iluvatar-simulator" }
