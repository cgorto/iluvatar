[package]
name = "iluvatar-camera"
description = "Camera unit implementation for Iluvatar"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "iluvatar-camera"
path = "src/main.rs"

[features]
default = ["sim"]
sim = []
real = ["dep:v4l", "dep:gpsd_proto", "dep:serde_json"]
k230 = ["dep:cc"]  # K230 SDK VICAP backend (requires cross-compilation)
simd = []
profile = ["dep:tracy-client"]  # Tracy profiler integration

[dependencies]
iluvatar-core = { workspace = true }
glam = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
smol = { workspace = true }
async-channel = { workspace = true }
futures-lite = { workspace = true }
async-compat = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }

# TLS certificate verification
sha2 = "0.10"
hex = "0.4"
rustls-pemfile = "2.1"

# Camera capture
v4l = { version = "0.14", optional = true } # Uncomment for Linux video capture

# Image processing
image = "0.25"

# Configuration
toml = "0.8"

# Memory management
bumpalo = { workspace = true }

# Self-referential struct support
ouroboros = "0.18"

# Signal handling for graceful shutdown
async-signal = "0.2"

# Better random for jitter
fastrand = "2.1"

# GPS via gpsd
gpsd_proto = { version = "1.0", optional = true }
serde_json = { version = "1.0", optional = true }

# Profiling
tracy-client = { version = "0.18", optional = true, default-features = false, features = ["enable"] }

[build-dependencies]
cc = { version = "1.0", optional = true }
