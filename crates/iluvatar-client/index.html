<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iluvatar Control Center</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #1a1a2e;
        color: #eee;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        background: #16213e;
        padding: 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #0f3460;
      }

      header h1 {
        font-size: 1.2rem;
        font-weight: 500;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #e94560;
      }

      .status-dot.connected {
        background: #4ade80;
      }

      main {
        flex: 1;
        display: flex;
        overflow: hidden;
      }

      #cesiumContainer {
        flex: 1;
      }

      aside {
        width: 300px;
        background: #16213e;
        border-left: 1px solid #0f3460;
        overflow-y: auto;
        padding: 1rem;
      }

      .panel {
        margin-bottom: 1rem;
      }

      .panel h2 {
        font-size: 0.9rem;
        font-weight: 500;
        margin-bottom: 0.5rem;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .object-list {
        font-size: 0.85rem;
      }

      .object-item {
        background: #1a1a2e;
        padding: 0.5rem;
        margin-bottom: 0.5rem;
        border-radius: 4px;
        border-left: 3px solid #e94560;
      }

      .object-item .id {
        font-weight: 600;
        margin-bottom: 0.25rem;
      }

      .object-item .details {
        color: #94a3b8;
        font-size: 0.8rem;
      }

      .camera-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
        gap: 0.5rem;
      }

      .camera-status {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.5rem;
        background: #1a1a2e;
        border-radius: 4px;
        font-size: 0.8rem;
      }

      .camera-status::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #e94560;
        margin-right: 0.3rem;
      }

      .camera-status.online::before {
        background: #4ade80;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>ILUVATAR CONTROL CENTER</h1>
      <div class="status">
        <div class="status-dot" id="connectionStatus"></div>
        <span id="connectionText">Disconnected</span>
      </div>
    </header>
    <main>
      <div id="cesiumContainer"></div>
      <aside>
        <div class="panel">
          <h2>Tracked Objects (<span id="objectCount">0</span>)</h2>
          <div class="object-list" id="objectList"></div>
        </div>
        <div class="panel">
          <h2>Cameras</h2>
          <div class="camera-grid" id="cameraGrid"></div>
        </div>
        <div class="panel">
          <h2>System Status</h2>
          <div id="systemStatus">
            <div>Uptime: <span id="uptime">--</span></div>
            <div>Active Voxels: <span id="voxelCount">--</span></div>
          </div>
        </div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
