<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iluvatar Perception</title>
    <style>
        body {
            margin: 0;
            background-color: #050505;
            color: #a0a0a0;
            font-family: monospace;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 10px;
            border-radius: 4px;
        }
        #metrics {
            position: absolute;
            top: 10px;
            right: 10px;
            text-align: right;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="status">Connecting to the void...</div>
    <div id="metrics">
        Objects: 0<br>
        FPS: 0
    </div>
    <canvas id="canvas"></canvas>
    <script src="script.js"></script>
</body>
</html>
